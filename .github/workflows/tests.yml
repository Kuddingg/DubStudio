# Tự chạy bộ test nhanh mỗi lần đưa code lên GitHub (push / pull request).
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.8.1 "numpy<2" opencv-python==4.10.0.84 edge-tts pytest
      - name: Chạy test nhanh
        run: python -X utf8 -m pytest -m "not slow" -v
